  # 非交易所监控对象（MEV / 套利机器人）
  # jaredfromsubway.eth：ETH 主网最活跃的三明治套利机器人之一（ENS 已在 Etherscan/Basescan 验证）
  - {exchange: MEV Bot, label: "jaredfromsubway.eth", address: "0xae2Fc483527B8EF99EB5D9B44875F005ba1FaE13",
     min_usd: 50000, internal: true, skip_external: true}
  # 说明：该地址每天上千笔微额外部交易（1e-16 ETH 级），噪声极大；
  #      真正的利润归集走「合约→EOA 的内部交易」（如 0x1f2f…→本地址 50 ETH），
  #      所以这里 skip_external + internal:true，阈值降到 $5 万。

scan:
  days: 2                 # 回看天数
  min_usd: 1_000_000      # 单笔 >= 100 万美金才通知
  max_pages: 3            # 每个地址最多翻页数（1000 条/页）
  etherscan_key_file: "D:/hermes/factor_icir/config/.api_keys.env"
  etherscan_key_name: "ETHERSCAN_TOKEN"
  proxy: "http://127.0.0.1:7890"
  feishu_webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/ba3a2e18-e6d4-42a3-9858-afd279371fd9"
  notify: true
